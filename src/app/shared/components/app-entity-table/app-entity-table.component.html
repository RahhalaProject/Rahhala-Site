<p-table
  #dt
  [value]="items"
  [dataKey]="dataKey"
  [loading]="loading"
  [paginator]="true"
  [rows]="rowsPerPage"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [rowHover]="true"
  [globalFilterFields]="globalFilterFields"
  [sortMode]="'single'"
  styleClass="app-entity-table-datatable"
  [tableStyle]="{ 'min-width': '52rem' }"
  responsiveLayout="scroll"
>
  <ng-template pTemplate="caption">
    <div class="entity-table-caption">
      <span class="entity-table-search">
        <i class="pi pi-search entity-table-search-icon" aria-hidden="true"></i>
        <input
          pInputText
          type="text"
          class="entity-table-search-input"
          (input)="onGlobalFilter(dt, $event)"
          [placeholder]="searchPlaceholderKey | translate"
        />
      </span>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <ng-container *ngFor="let col of colDefs; trackBy: trackByField">
        <th *ngIf="col.sortable === false">
          <span class="entity-table-th-label">{{ col.headerKey | translate }}</span>
        </th>
        <th *ngIf="col.sortable !== false" [pSortableColumn]="col.field">
          <span class="entity-table-th-label">{{ col.headerKey | translate }}</span>
          <p-sortIcon [field]="col.field" />
        </th>
      </ng-container>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-row>
    <tr>
      <td *ngFor="let col of colDefs; trackBy: trackByField">
        {{ formatCell(row, col) }}
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td [attr.colspan]="colDefs.length || 1" class="entity-table-empty">
        {{ emptyMessageKey | translate }}
      </td>
    </tr>
  </ng-template>
</p-table>
