<div class="title-sec">
  <div class="title-div">
    <h4>{{ "createOrder" | translate }}</h4>
  </div>
</div>
<div class="container">
  <p-card class="box">
    <div class="form">
      <div class="mb-6">
        <!-- Payment -->
        <button
          class="form-item"
          (click)="showShipmentDetailsDialog()"
          type="button"
        >
          <span
            ><i class="pi pi-car"></i>{{ "shipmentDetails" | translate }}</span
          >
          <i
            class="pi"
            [ngClass]="
              currentLang === 'ar' ? 'pi-angle-left' : 'pi-angle-right'
            "
          ></i>
        </button>

        <!-- Upload -->
        <button
          class="form-item dashed"
          (click)="showUploadDialog()"
          type="button"
        >
          <span
            ><i class="pi pi-camera"></i>{{ "uploadImage" | translate }}</span
          >
        </button>

        <!-- Location -->
        <button class="form-item" (click)="showLocationDialog()" type="button">
          <span
            ><i class="pi pi-map-marker"></i
            >{{ "pickupAndDeliveryLocation" | translate }}</span
          >
        </button>

        <!-- Delivery Date -->
        <button
          class="form-item"
          (click)="showDeliveryDateDialog()"
          type="button"
        >
          <span
            ><i class="pi pi-calendar"></i
            >{{ "deliveryDate" | translate }}</span
          >
        </button>

        <!-- Payment -->
        <button
          class="form-item"
          (click)="showPaymentMethodDialog()"
          type="button"
          [attr.aria-label]="'paymentMethod' | translate"
        >
          <span
            ><i class="pi pi-credit-card"></i
            >{{ "paymentMethod" | translate }}</span
          >
          <i
            class="pi"
            [ngClass]="
              currentLang === 'ar' ? 'pi-angle-left' : 'pi-angle-right'
            "
            aria-hidden="true"
          ></i>
        </button>

        <!-- requestPrivateTrip -->
        <button
          class="form-item"
          (click)="showRequestPrivateTripDialog()"
          type="button"
          [attr.aria-label]="'requestPrivateTrip' | translate"
        >
          <span
            ><i class="pi pi-credit-card"></i
            >{{ "requestPrivateTrip" | translate }}</span
          >
          <i
            class="pi"
            [ngClass]="
              currentLang === 'ar' ? 'pi-angle-left' : 'pi-angle-right'
            "
            aria-hidden="true"
          ></i>
        </button>

        <!-- map -->
        <button
          class="form-item"
          (click)="showLocationMapDialog()"
          type="button"
          [attr.aria-label]="'map' | translate"
        >
          <span><i class="pi pi-credit-card"></i>{{ "map" | translate }}</span>
          <i
            class="pi"
            [ngClass]="
              currentLang === 'ar' ? 'pi-angle-left' : 'pi-angle-right'
            "
            aria-hidden="true"
          ></i>
        </button>

        <p-button
          class="initialPricing-btn"
          [label]="'initialPricing' | translate"
          severity="contrast"
          size="small"
        />
        <p-button
          [label]="'orderConfirmation' | translate"
          severity="contrast"
          size="small"
        />
      </div>
    </div>
  </p-card>
</div>

<!------------- Start shipment Details ------------>
<p-dialog
  [modal]="true"
  [(visible)]="visibleShipmentDetails"
  [style]="{ width: '50rem' }"
  class="ShipmentDetails-form"
>
  <div class="flex flex-col h-48 mb-3">
    <div
      class="border-2 border-dashed border-surface-200 dark:border-surface-700 rounded bg-surface-50 dark:bg-surface-950 flex-auto flex justify-center items-center font-medium"
    >
      <div class="flex justify-center card-cus">
        <div class="row">
          <div class="col-12 mb-3">
            <p-select
              [options]="cities"
              optionLabel="name"
              placeholder="{{ 'shipmentType' | translate }}"
              class="w-full md:w-56"
            />
          </div>
          <div class="col-12 mb-3">
            <div class="checks">
              <div class="flex items-center item">
                <label for="ingredient1" class="ml-2">
                  {{ "express" | translate }}
                </label>
                <p-checkbox inputId="ingredient1" name="pizza" value="Cheese" />
              </div>
              <div style="margin: 0 5px"></div>
              <div class="flex items-center item">
                <label for="ingredient1" class="ml-2">
                  {{ "normal" | translate }}
                </label>
                <p-checkbox inputId="ingredient1" name="pizza" value="Cheese" />
              </div>
            </div>
          </div>
          <div class="col-12 mb-3">
            <p-select
              [options]="cities"
              optionLabel="name"
              placeholder="{{ 'orderType' | translate }}"
              class="w-full md:w-56"
            />
          </div>
          <div class="col-12 mb-3">
            <div class="tags-div">
              <p-tag severity="info" value="{{ 'enterLength' | translate }}" />
              <p-tag severity="info" value="{{ 'enterWidth' | translate }}" />
              <p-tag severity="info" value="{{ 'enterHeight' | translate }}" />
            </div>
          </div>
          <div class="col-12 mb-3">
            <p-iftalabel>
              <textarea
                pTextarea
                id="description"
                rows="5"
                style="resize: none"
              ></textarea>
              <label for="description">{{
                "additionalNotes" | translate
              }}</label>
            </p-iftalabel>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="flex w-full justify-between">
    <p-button
      label="{{ 'cancel' | translate }}"
      severity="secondary"
      (click)="visibleShipmentDetails = false"
      (keydown.enter)="visibleShipmentDetails = false"
    />
    <p-button
      label="{{ 'save' | translate }}"
      (click)="visibleShipmentDetails = false"
      (keydown.enter)="visibleShipmentDetails = false"
    />
  </div>
</p-dialog>
<!------------- End shipment Details ------------>

<!------------- Start Upload ------------>
<p-dialog
  [modal]="true"
  [(visible)]="visibleUpload"
  [style]="{ width: '50rem' }"
  class="Upload-form"
>
  <div class="flex flex-col h-48 mb-3">
    <div
      class="border-2 border-dashed border-surface-200 dark:border-surface-700 rounded bg-surface-50 dark:bg-surface-950 flex-auto flex justify-center items-center font-medium"
    >
      <div class="flex justify-center card-cus">
        <div class="row">
          <div class="col-12 mb-3">
            <p-toast />
            <p-fileupload
              name="demo[]"
              url="https://www.primefaces.org/cdn/api/upload.php"
              (onUpload)="onUpload($event)"
              [multiple]="true"
              accept="image/*"
              maxFileSize="1000000"
              mode="advanced"
            >
              <ng-template #empty>
                <div>Drag and drop files to here to upload.</div>
              </ng-template>
            </p-fileupload>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="flex w-full justify-between">
    <p-button
      label="{{ 'cancel' | translate }}"
      severity="secondary"
      (click)="visibleUpload = false"
      (keydown.enter)="visibleUpload = false"
    />
    <p-button
      label="{{ 'save' | translate }}"
      (click)="visibleUpload = false"
      (keydown.enter)="visibleUpload = false"
    />
  </div>
</p-dialog>
<!------------- End Upload ------------>
