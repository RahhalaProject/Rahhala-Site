<div class="sign-in-container">
    <p-card class="sign-in-box">
        <div class="form">
            <div class="mb-4">
                <label for="username" class="font-bold mb-2 block">{{ 'username' | translate }}</label>
                <input type="text" pInputText id="username" fluid [placeholder]="'enterUsername' | translate"/>
            </div>
            <div class="mb-4">
                <label for="password" class="font-bold mb-2 block">{{ 'password' | translate }}</label>
                <input type="password" pInputText id="password" fluid [placeholder]="'enterPassword' | translate"/>
            </div>
            <div class="mb-6">
                <span class="forget">{{ 'forgotPassword' | translate }}</span>
                <p-button
                    [label]="'login' | translate"
                    severity="contrast"
                    size="small"
                    routerLink="/otp-verification"
                ></p-button>
            </div>
            <div>
                <div class="social-login-separator">
                    <div class="line"></div>
                    <span class="or-text">{{ 'loginWith' | translate }}</span>
                    <div class="line"></div>
                </div>
                <div class="social-icons">
                    <a href="#"><img src="/icons/apple.svg" alt="Apple"></a>
                    <a href="#"><img src="/icons/google.svg" alt="Google"></a>
                </div>
            </div>
        </div>
    </p-card>
</div>
